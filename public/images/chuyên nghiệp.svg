<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 700" width="300" height="700">
  <defs>
    <linearGradient id="silk-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FFFDF8" />
      <stop offset="100%" stop-color="#FAF5EB" />
    </linearGradient>
    <clipPath id="seal-clip">
      <circle cx="0" cy="0" r="34" />
    </clipPath>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&amp;display=swap');
      text {
        font-family: 'Playfair Display', 'Cinzel', 'Times New Roman', serif;
        user-select: none;
      }
    </style>
  </defs>

  <!-- Outer Chamfered Plaque Border and Silk Fill -->
  <polygon
    points="42,0 258,0 300,42 300,658 258,700 42,700 0,658 0,42"
    fill="url(#silk-bg)"
    stroke="#9F1D24"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- Inner Fine Red Inlay Border -->
  <polygon
    points="48,8 252,8 292,48 292,652 252,692 48,692 8,652 8,48"
    fill="none"
    stroke="#9F1D24"
    stroke-width="1.4"
    stroke-opacity="0.85"
    stroke-linejoin="round"
  />

  <!-- 1. Header Number -->
  <text x="150" y="148" text-anchor="middle" font-weight="900" font-size="94" fill="#102F49" letter-spacing="0.04em">04</text>

  <!-- 2. Gold Ornamental Divider -->
  
  <g transform="translate(150, 195)">
    <!-- Left hairline -->
    <line x1="-105" y1="0" x2="-26" y2="0" stroke="#C99B49" stroke-width="1.2" stroke-linecap="round" />
    <!-- Right hairline -->
    <line x1="26" y1="0" x2="105" y2="0" stroke="#C99B49" stroke-width="1.2" stroke-linecap="round" />
    
    <!-- Accent dots on lines -->
    <circle cx="-28" cy="0" r="1.8" fill="#C99B49" />
    <circle cx="28" cy="0" r="1.8" fill="#C99B49" />

    <!-- Tiered fan / cloud motif -->
    <!-- Base tier (3 scallops) -->
    <path d="M -18,4 Q -12,-4 -6,4 Q 0,-4 6,4 Q 12,-4 18,4 Z" fill="#E5C16C" stroke="#B88A3B" stroke-width="0.8" />
    <path d="M -15,2 Q -12,-2 -9,2 M -3,2 Q 0,-2 3,2 M 9,2 Q 12,-2 15,2" stroke="#FFFFFF" stroke-width="0.6" stroke-linecap="round" />
    
    <!-- Middle tier (2 scallops) -->
    <path d="M -12,-2 Q -6,-10 0,-2 Q 6,-10 12,-2 Z" fill="#D4AF37" stroke="#B88A3B" stroke-width="0.8" />
    <path d="M -9,-3 Q -6,-7 -3,-3 M 3,-3 Q 6,-7 9,-3" stroke="#FFFFFF" stroke-width="0.6" stroke-linecap="round" />
    
    <!-- Top tier (1 scallop crest) -->
    <path d="M -6,-7 Q 0,-15 6,-7 Z" fill="#C59B27" stroke="#9A7016" stroke-width="0.8" />
    <circle cx="0" cy="-10" r="1.2" fill="#FFFFFF" />
  </g>


  <!-- 3. Value Words (Vertical Stack) -->
  <g>
    <text x="150" y="325" text-anchor="middle" font-family="'Playfair Display', 'Cinzel', 'Noto Serif', 'Times New Roman', serif" font-weight="900" font-size="40" fill="#102F49" letter-spacing="0.12em">CHUYÊN</text>
      <text x="150" y="401" text-anchor="middle" font-family="'Playfair Display', 'Cinzel', 'Noto Serif', 'Times New Roman', serif" font-weight="900" font-size="40" fill="#102F49" letter-spacing="0.12em">NGHIỆP</text>
  </g>

  <!-- 4. Traditional Red Wave Seal (Hanko) -->
  
  <g transform="translate(150, 580)">
    <!-- Outer solid circle -->
    <circle cx="0" cy="0" r="38" fill="#FFF3F3" stroke="#9F1D24" stroke-width="2.5" />
    <!-- Inner dashed border -->
    <circle cx="0" cy="0" r="34" fill="none" stroke="#9F1D24" stroke-width="0.8" stroke-dasharray="2 1.5" />
    
    <!-- Wave clip path -->
    <g clip-path="url(#seal-clip)">
      <!-- Base wave curves -->
      <path d="M -38,20 C -20,10 -10,25 0,15 C 10,5 20,20 38,10 L 38,38 L -38,38 Z" fill="#9F1D24" fill-opacity="0.25" />
      <path d="M -38,26 C -18,18 -5,30 8,22 C 20,14 28,26 38,18 L 38,38 L -38,38 Z" fill="#9F1D24" fill-opacity="0.4" />
      
      <!-- Great curling wave (Hokusai style) -->
      <path d="M -36,28 C -22,12 -8,12 2,24 C 8,16 16,8 24,18 C 28,12 34,16 38,24" fill="none" stroke="#9F1D24" stroke-width="1.8" stroke-linecap="round" />
      <path d="M -30,16 C -18,-2 -2,-4 8,10 C 14,2 22,0 28,10" fill="none" stroke="#9F1D24" stroke-width="1.8" stroke-linecap="round" />
      
      <!-- Primary crest claw -->
      <path d="M -24,4 C -14,-14 2,-18 12,-4 C 8,-12 0,-14 -6,-8" fill="#9F1D24" />
      <path d="M -16,-6 C -8,-22 6,-24 16,-8 C 12,-16 4,-18 -2,-12" fill="#9F1D24" />
      <path d="M -8,-16 C 0,-28 12,-26 20,-12 C 16,-20 8,-22 4,-16" fill="#9F1D24" />

      <!-- Wave swirl lines -->
      <path d="M -32,32 C -15,18 0,22 15,30 C 22,24 30,26 36,32" fill="none" stroke="#9F1D24" stroke-width="1.2" />
      <path d="M -26,22 C -12,8 4,12 18,22" fill="none" stroke="#9F1D24" stroke-width="1.2" />
      <path d="M -18,10 C -6,-2 8,2 18,12" fill="none" stroke="#9F1D24" stroke-width="1.2" />
      <path d="M -10,-2 C 0,-12 12,-8 18,2" fill="none" stroke="#9F1D24" stroke-width="1.2" />

      <!-- Sea foam spray droplets -->
      <circle cx="-18" cy="-12" r="1.3" fill="#9F1D24" />
      <circle cx="-10" cy="-20" r="1.5" fill="#9F1D24" />
      <circle cx="-2" cy="-26" r="1.4" fill="#9F1D24" />
      <circle cx="8" cy="-28" r="1.6" fill="#9F1D24" />
      <circle cx="16" cy="-24" r="1.3" fill="#9F1D24" />
      <circle cx="2" cy="-16" r="1.2" fill="#9F1D24" />
      <circle cx="10" cy="-18" r="1.3" fill="#9F1D24" />
      <circle cx="20" cy="-14" r="1.2" fill="#9F1D24" />
      <circle cx="26" cy="-6" r="1.4" fill="#9F1D24" />
    </g>
    <!-- Stamp Red Center Kanji / Sun dot -->
    <circle cx="0" cy="-18" r="3.2" fill="#9F1D24" />
  </g>

</svg>