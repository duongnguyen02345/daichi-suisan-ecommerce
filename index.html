    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230E7A32'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.4z'/></svg>" />
    <meta name="viewport" id="app-viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var p = window.location.pathname;
          var isDesktopPage = p === '/' || p === '/about' || p === '';
          var isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
            (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) ||
            (window.screen.width <= 500 && ('ontouchstart' in window || navigator.maxTouchPoints > 0));
          if (isMobile) {
            document.documentElement.classList.add('is-mobile-device');
            if (isDesktopPage) {
              var sw = window.screen.width || 390;
              var s = (sw / 1280).toFixed(4);
              var vp = document.getElementById('app-viewport');
              if (vp) {
                vp.setAttribute('content', 'width=1280, initial-scale=' + s + ', maximum-scale=3.0, user-scalable=yes');
              }
              document.documentElement.classList.add('force-desktop-mode');
            }
          }
        } catch (e) {}
      })();
    </script>
    <title>DAICHI SUISAN - Tinh hoa thực phẩm Nhật Bản</title>
